<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="ModelQuest: a why-first mechanical-engineering machine-learning journey with 13 interactive quests.">
<meta name="theme-color" content="#030303">
<title>ModelQuest — Interactive ML World</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="world-v5.css">
<link rel="stylesheet" href="map-v8.css">
<link rel="stylesheet" href="labs-v10.css">
<link rel="stylesheet" href="quality-v11.css">
<link rel="stylesheet" href="world-canonical-v12.css">
<link rel="stylesheet" href="calibration-lab.css">
</head>
<body>
<header class="top"><div class="topin">
  <div class="brand"><div class="logo">MQ</div><span>ModelQuest</span><span style="color:var(--muted);font-size:.76rem">interactive ML world</span></div>
  <button class="search" id="searchOpen">Search concepts, errors, tools… <span>Ctrl K</span></button>
  <button class="btn" id="resume">▶ Resume</button>
  <button class="btn" id="exportBtn" title="Download a tiny progress backup">Backup</button>
  <button class="btn" id="importBtn" title="Restore a progress backup">Restore</button>
  <input id="importFile" type="file" accept="application/json" hidden>
  <button class="btn" id="theme" aria-label="Theme">◐</button>
</div></header>
<div class="layout">
  <aside class="side" id="side"></aside>
  <main class="main">
    <div class="mobile" id="mobile"></div>
    <section class="hero" id="homeHero" hidden></section>
    <div id="view"></div>
  </main>
</div>
<div class="modalback" id="searchModal"><div class="modal"><div class="mhead"><h2>Search ModelQuest</h2><button class="x" id="closeSearch">×</button></div><div class="mbody"><input class="searchin" id="searchInput" placeholder="Describe what is confusing you"><div id="results"></div></div></div></div>
<div class="modalback" id="stuckModal"><div class="modal"><div class="mhead"><h2>I’m stuck</h2><button class="x" id="closeStuck">×</button></div><div class="mbody"><p style="color:var(--muted)">Choose what is blocking you. The goal is to diagnose the problem, not guess.</p><div class="stuckopts" id="stuckOpts"></div><div id="stuckAnswer"></div></div></div></div>
<div class="toast" id="toast">Copied</div>
<script src="curriculum-v11.js"></script>
<script src="labs-v10.js"></script>
<script src="world-canonical-v12.js"></script>
<script src="calibration-lab.js"></script>
<script src="quality-v11.js"></script>
<script src="search-help.js"></script>
</body>
</html>
