name: Fix ModelQuest v7 Python entry

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-v7-python.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch selector and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('learning-v7.js')
          s=p.read_text()
          old="const grid=document.querySelector('.v5-landing .v5-resource-grid');"
          new="const grid=document.querySelector('.v5-home-sections .v5-resource-grid');"
          if old not in s:
              raise SystemExit('Expected selector not found')
          p.write_text(s.replace(old,new))
          PY
          node --check learning-v7.js
      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-v7-python.yml
          git add -A
          git commit -m "Fix Python Workshop entry on Base Camp"
          git push origin main
