name: Unpack current ModelQuest world

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/unpack-v5.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack world-v5 payload into readable source
        run: |
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const parts = [1,2,3,4,5].map(n => fs.readFileSync(`world-v5-part${n}.js`, 'utf8'));
          const chunks = parts.flatMap(text => [...text.matchAll(/\.push\('([^']*)'\)/g)].map(m => m[1]));
          if (!chunks.length) throw new Error('No world payload chunks found');
          const source = zlib.gunzipSync(Buffer.from(chunks.join(''), 'base64')).toString('utf8');
          fs.writeFileSync('world-current.js', `/* Readable source unpacked from the approved World v5 payload. */\n${source}\n`);
          console.log(`Wrote world-current.js (${source.length} chars)`);
          NODE
          node --check world-current.js

      - name: Commit readable source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-current.js
          git commit -m "Unpack ModelQuest world into readable source"
          git push origin main
