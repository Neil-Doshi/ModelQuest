name: Build and deploy ModelQuest

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "modelquest-pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout ModelQuest
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          for file in *.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Explain Pages setup when disabled
        if: steps.pages.outcome != 'success'
        run: echo "Code validation passed. Enable Settings > Pages > Source > GitHub Actions to publish the site."

      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
