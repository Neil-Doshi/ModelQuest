name: Build and deploy ModelQuest

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "modelquest-pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout ModelQuest
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          for file in *.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Validate curriculum coherence
        run: node scripts/validate-curriculum.mjs

      - name: Ensure GitHub Pages is enabled for Actions
        id: enable_pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e

          if gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is already enabled."
            exit 0
          fi

          echo "GitHub Pages is not enabled yet. Attempting to enable it with GitHub Actions as the build type."
          RESPONSE=$(gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/pages" \
            -f build_type=workflow 2>&1)
          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages could not be enabled automatically. GitHub returned: $RESPONSE"
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            if gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "GitHub Pages is enabled for GitHub Actions."
              exit 0
            fi
            sleep 2
          done

          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::warning::GitHub accepted the Pages enable request, but the Pages site was not readable yet. Run the workflow again after a short wait."

      - name: Configure GitHub Pages
        id: pages
        if: steps.enable_pages.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Explain Pages setup when unavailable
        if: steps.enable_pages.outputs.ready != 'true' || steps.pages.outcome != 'success'
        run: echo "Code validation passed, but GitHub Pages is not ready for deployment yet."

      - name: Upload Pages artifact
        if: steps.enable_pages.outputs.ready == 'true' && steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        if: steps.enable_pages.outputs.ready == 'true' && steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
